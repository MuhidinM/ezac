name: CI and deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Every pull request and every push: the code must lint, type-check, pass the
  # unit tests, build and pass the dependency audit before it can deploy.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version in package.json "packageManager" (the one
      # that wrote pnpm-lock.yaml), so CI and laptops can't drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # next-env.d.ts is not in git; typegen writes it before tsc runs.
      - name: Type-check
        run: |
          pnpm exec next typegen
          pnpm typecheck

      # Unit tests (Vitest, tests/**). They run in Node and need no gateway.
      - name: Test
        run: pnpm test

      # No gateway is needed: API_BASE_URL is only required when the server runs.
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # One deploy at a time; a newer push waits for the running one instead of cancelling it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # deploy.sh (deploy/deploy.sh in this repo) is the forced command of this key on the
      # server. It builds this exact commit in its own folder, starts it next to the live
      # release, health-checks it and only then switches nginx: no downtime, and the old
      # release keeps running for an instant rollback (Rollback workflow).
      - name: Deploy
        # Keepalives: the install can run for minutes with no output.
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "deploy ${{ github.sha }}"

      - name: Check the live site serves this commit
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ezaac.com' }}
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          url="${SITE_URL%/}/bff/health"
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 10 "$url" || true)
            # The full sha (blue/green deploy.sh) or its first 12 characters (older deploys).
            case "$body" in *"\"release\":\"${EXPECTED_RELEASE:0:12}"*) echo "$body"; exit 0 ;; esac
            echo "attempt $attempt: $body"
            sleep 10
          done
          echo "::error::$url does not report release $EXPECTED_RELEASE"
          exit 1
